<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RE/MAX Infinity Market Watch</title>
<meta name="description" content="Бусад оффисуудын сүүлийн 2 долоо хоногийн шинэ листүүд, Hot 100">
<meta property="og:title" content="RE/MAX Infinity Market Watch">
<meta property="og:description" content="Бусад оффисуудын сүүлийн 2 долоо хоногийн шинэ листүүд, Hot 100">
<meta property="og:url" content="https://margad200309-alt.github.io/hot100/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: classifieds desk agents already know (unegui.mn), in RE/MAX Infinity colours
   IDEA: unegui search page: top search + location, title with room links, filter column, feed
   PICTURE: photo-card feed, Hot first
   COLOUR and TYPE: #080808 / #071B49 / #E31837 on white; Montserrat + Inter
   LAYOUT: topbar, nav tabs, title row, 280px filter column + grid; phone: filter sheet */
:root{color-scheme:light;--blk:#080808;--navy:#071b49;--red:#e31837;--bg:#f5f6f8;--card:#fff;--ink:#0b0d12;--mut:#646c79;--line:#e6e8ee;--ease:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
#intro{position:fixed;inset:0;z-index:60;background:#080808;display:grid;place-items:center;transition:opacity .45s var(--ease),visibility .45s}
#intro.out{opacity:0;visibility:hidden}#intro img{width:min(180px,42vw);animation:rise .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.in{max-width:1220px;margin:0 auto}
.top{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,var(--blk),var(--navy));color:#fff;padding:10px max(3vw,12px)}
.top .in{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:8px;flex:none}.brand .b{width:26px}.brand .w{width:108px}
.sbar{flex:1;display:grid;grid-template-columns:1fr 1fr 1.7fr auto;background:#fff;color:var(--ink);border-radius:14px;padding:4px;max-width:880px;margin-left:auto}
.sf{position:relative;display:flex;flex-direction:column;justify-content:center;padding:3px 14px;border-right:1px solid var(--line)}
.sf>span{font-size:11.5px;font-weight:700;color:var(--mut);letter-spacing:.02em}
.sf select,.sf input{border:0;outline:0;background:none;font-size:16px;font-weight:600;padding:0;min-height:26px;width:100%;cursor:pointer}
.sf input{cursor:text}.sf input::placeholder{color:#9aa1ad;font-weight:500}
.sf select:disabled{color:#9aa1ad;cursor:not-allowed}
.sq{border-right:0}
.sbar>button{border:0;background:var(--red);color:#fff;border-radius:10px;padding:0 22px;min-height:50px;font-weight:700;cursor:pointer}
.sbar>button:hover{background:#c8102e}
.sug{position:absolute;top:calc(100% + 10px);left:0;right:0;min-width:260px;background:#fff;border-radius:12px;box-shadow:0 14px 36px rgba(8,8,8,.22);max-height:340px;overflow:auto;display:none;z-index:40;padding:6px}
.sug.open{display:block}
.sug button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:0 10px;min-height:44px;border-radius:8px;cursor:pointer}
.sug button:hover,.sug button.act{background:#f1f3f7}
.sug button i{font-style:normal;color:var(--mut);font-size:13px;flex:none}
.sug mark{background:none;color:var(--red);font-weight:700}
.sug .no{padding:12px 10px;color:var(--mut);font-size:14px}
.nav{background:var(--card);border-bottom:1px solid var(--line);padding:0 max(3vw,12px)}
.nav .in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.nav .in::-webkit-scrollbar{display:none}
.nav button{flex:none;border:0;background:none;padding:0 14px;min-height:48px;font-weight:600;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent}
.nav button.on{color:var(--ink);border-bottom-color:var(--red)}
.nav button i{font-style:normal;font-weight:500;margin-left:5px;font-size:13px;opacity:.7}
main{padding:14px max(3vw,12px) 60px}
.crumb{font-size:13px;color:var(--mut);margin-bottom:4px}
h1{font-family:Montserrat,sans-serif;font-size:clamp(22px,3vw,30px);margin:0;font-weight:800;line-height:1.2}
h1 small{font-family:Inter,sans-serif;font-weight:500;color:var(--mut);font-size:.7em;margin-left:6px}
.rooms{display:grid;grid-template-columns:repeat(3,max-content);gap:4px 36px;margin:10px 0 16px}
.rooms button{border:0;background:none;padding:2px 0;cursor:pointer;font-weight:600;text-align:left;min-height:28px}
.rooms button i{font-style:normal;font-weight:400;color:var(--mut);margin-left:4px}
.rooms button.on{color:var(--red)}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.cat{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:36px;cursor:pointer;font-size:14px;font-weight:600}
.cat.on{background:var(--blk);border-color:var(--blk);color:#fff}.cat i{font-style:normal;font-weight:500;opacity:.55;margin-left:5px}
.lay{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;align-items:start}
aside{position:sticky;top:76px;max-height:calc(100vh - 90px);display:flex;flex-direction:column;gap:12px}
.fx{overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:2px}
.fl{display:flex;flex-direction:column;gap:6px}
.fl>span{font-weight:700;font-size:14px}
.fl select,.fl input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 12px;font-size:16px}
.fl select:disabled{opacity:.55}
.pair{display:flex;gap:8px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:38px;padding:0 12px;cursor:pointer;font-weight:600}
.chk button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.mapb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border-radius:12px;background:linear-gradient(135deg,#e8f2ea,#dfe9f6);font-weight:600;font-size:14px}
.show{border:0;background:var(--blk);color:#fff;border-radius:12px;min-height:50px;font-weight:700;font-size:15px;cursor:pointer;flex:none}
.reset{border:0;background:none;color:var(--mut);text-decoration:underline;cursor:pointer;min-height:32px;font-size:13.5px}
.savebar{display:flex;align-items:center;justify-content:center;gap:8px;background:#eceef3;border-radius:12px;min-height:44px;margin-bottom:12px;cursor:pointer;border:0;width:100%;font-weight:600}
.savebar.on{background:#fdecef;color:#b3112a}
.svs{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.svs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 12px;min-height:34px;cursor:pointer;font-size:13.5px;font-weight:600}
.svs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.svs em{font-style:normal;background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font-size:11.5px;margin-left:5px}
.svs .x{border:0;background:none;color:var(--mut);min-height:34px;padding:0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.c{position:relative;background:var(--card);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(8,8,8,.04),0 8px 22px -16px rgba(7,27,73,.3);animation:up .45s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pic{position:relative;display:block;aspect-ratio:4/3;background:linear-gradient(135deg,#e9ecf2,#dfe3ea);overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
.c:hover .pic img{transform:scale(1.04)}
.pic .np{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:13px}
.hot{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-weight:700;font-size:12.5px;border-radius:8px;padding:3px 9px}
.rt{position:absolute;bottom:10px;left:10px;background:rgba(255,255,255,.95);color:var(--navy);font-weight:700;font-size:12px;border-radius:7px;padding:2px 8px}
.fav{position:absolute;top:8px;right:8px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--red);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.price{font-family:Montserrat,sans-serif;font-size:20px;font-weight:800;line-height:1.2}
.price small{font-size:13px;color:var(--mut);font-weight:600}
.ti{font-weight:600;margin:0}
.loc{color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.ft{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ag{font-size:13px;color:var(--mut);line-height:1.35}.ag b{color:var(--ink);font-weight:700;font-size:14px}
.acts{display:flex;gap:8px}
.call{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--red);color:#fff;text-decoration:none;border-radius:10px;padding:0 12px;min-height:44px;font-size:15px;font-weight:700;white-space:nowrap}
.call svg{width:17px;height:17px;flex:none}
.call:hover{background:#c8102e}
.mls{flex:none;display:inline-flex;align-items:center;background:var(--blk);color:#fff;text-decoration:none;border-radius:10px;padding:0 14px;min-height:44px;font-size:13px;font-weight:700;white-space:nowrap}
.mls:hover{background:var(--navy)}
.empty{grid-column:1/-1;background:var(--card);border-radius:16px;padding:36px 20px;text-align:center;color:var(--mut)}
.more{display:block;margin:20px auto 0;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 24px;min-height:46px;cursor:pointer;font-weight:700}
.note{color:var(--mut);font-size:13px;max-width:80ch;margin:24px 0 0}
.mtools{display:none}
.sh{position:fixed;inset:0;z-index:50;display:none}.sh.open{display:block}
.sh .bg{position:absolute;inset:0;background:rgba(8,8,8,.45)}
.sh .pn{position:absolute;left:0;right:0;bottom:0;max-height:90vh;display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;animation:sl .3s var(--ease)}
@keyframes sl{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
.sh .hd{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:17px}
.sh .hd button{border:0;background:none;font-size:26px;line-height:1;width:44px;height:44px;cursor:pointer}
.sh .bdy{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.sh .fo{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sh .fo .show{flex:1}
@media(min-width:900px){.sh .pn{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:min(460px,92vw);border-radius:20px;animation:none;max-height:86vh}}
@media(max-width:899px){
 .lay{grid-template-columns:1fr}aside{display:none}
 .top{position:static}
 .top .in{flex-wrap:wrap;gap:10px}
 .sbar{flex-basis:100%;grid-template-columns:1fr 1fr;margin:0}
 .sq{grid-column:1/-1;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
 .sbar>button{grid-column:1/-1;margin-top:4px;min-height:46px}
 aside{top:12px}
 .mtools{display:flex;gap:8px;margin:0 0 12px}
 .mtools button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;font-weight:700;cursor:pointer}
 .mtools .n{background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;margin-left:4px}
 .rooms{grid-template-columns:repeat(3,1fr);gap:4px 12px}
 .grid{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

 return `<article class="c" style="--i:${i%10}"><button type="button" class="fav" data-m="${esc(r.mls)}" aria-label="Хадгалах" aria-pressed="${SV[r.mls]?'true':'false'}">${SV[r.mls]?'♥':'♡'}</button>
 <a class="pic" href="${esc(r.url)}" target="_blank" rel="noopener" aria-label="remax.mn дээр үзэх">${r.img?`<img src="${r.img}" alt="" loading="lazy" decoding="async" onerror="this.remove()">`:'<span class="np">Фото remax.mn дээр</span>'}${r.k?`<span class="hot">Hot #${r.k}</span>`:''}${r.t==='R'?'<span class="rt">Түрээс</span>':''}</a>
 <div class="bd"><div class="price">${money(r.p)}${r.t==='R'&&r.p?' <small>/ сар</small>':''}</div><p class="ti">${esc(ti)}</p>
 <div class="loc">Улаанбаатар — ${esc(r.city)}${r.zone?' — '+esc(r.zone):''}${r.st?' · '+esc(r.st):''}</div>
 <div class="ft"><div class="ag"><b>${esc(r.ag||'Агент тодорхойгүй')}</b><br>${esc(r.of)} · ${ago(r.ts)}</div><div class="acts">${r.ph?`<a class="call" href="tel:${esc(tel(r.ph))}" aria-label="${esc(r.ag)} руу залгах"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>${esc(phn(r.ph))}</a>`:''}<a class="mls" href="${esc(r.url)}" target="_blank" rel="noopener">MLS ↗</a></div></div></div></article>`}
function filterFields(f,pre){
 const o=(v,l,c)=>`<option value="${v}"${String(c||'')===String(v)?' selected':''}>${l}</option>`;
 const pr=(k1,k2)=>`<div class="pair"><input id="${pre}${k1}" inputmode="decimal" placeholder="Доод" value="${esc(f[k1])}"><input id="${pre}${k2}" inputmode="decimal" placeholder="Дээд" value="${esc(f[k2])}"></div>`;
 return `<div class="fl"><span>Эрэмбэ</span><select id="${pre}sort">${o('','Үндсэн (Hot эхэндээ)',S.sort)}${o('new','Огноогоор',S.sort)}${o('pa','Үнэ өсөхөөр',S.sort)}${o('pd','Үнэ буурахаар',S.sort)}${o('aa','Талбай томоос',S.sort)}</select></div>
 <div class="fl"><span>Өрөөний тоо</span><div class="chk">${['1','2','3','4','5'].map(n=>`<button type="button" data-rm="${n}" class="${f.rm===n?'on':''}">${n==='5'?'5+':n}</button>`).join('')}</div></div>
 <div class="fl"><span>Үнэ, сая ₮</span>${pr('pmin','pmax')}</div>
 <div class="fl"><span>Талбай, м²</span>${pr('amin','amax')}</div>
 <div class="fl"><span>Хэдэн давхарт</span>${pr('fmin','fmax')}</div>
 <div class="fl"><span>Ашиглалтанд орсон он</span>${pr('ymin','ymax')}</div>`}
function readF(pre,base){const f={...base};['pmin','pmax','amin','amax','fmin','fmax','ymin','ymax'].forEach(k=>{const e=$('#'+pre+k);if(e)f[k]=e.value.trim()});const c=$('#'+pre+'city'),z=$('#'+pre+'zone');if(c)f.city=c.value;if(z)f.zone=f.city?z.value:'';return f}
function bindFields(root,pre,getF,setF,onLive){
 const live=()=>{onLive(readF(pre,getF()))};
 root.querySelectorAll('input').forEach(e=>e.addEventListener('input',live));
 root.querySelector('#'+pre+'sort').onchange=e=>{S.sort=e.target.value};
 root.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const f=readF(pre,getF());f.rm=f.rm===b.dataset.rm?'':b.dataset.rm;setF(f)});
}
let draft=null;
function side(){
 draft=draft||{...S.f};
 const n=results(draft).length;
 $('#side').innerHTML=`<div class="fx" id="fx">${filterFields(draft,'d-')}</div>
 <button type="button" class="show" id="dshow">${n.toLocaleString('en')} зар харуулах</button><button type="button" class="reset" id="dreset">Шүүлтүүр цэвэрлэх</button>`;
 bindFields($('#side'),'d-',()=>draft,f=>{draft=f;side()},f=>{draft=f;$('#dshow').textContent=results(f).length.toLocaleString('en')+' зар харуулах'});
 $('#dshow').onclick=()=>{S.f={...readF('d-',draft)};draft=null;S.n=20;S.ssi=null;render()};
 $('#dreset').onclick=()=>{S.f={...F0,city:S.f.city,zone:S.f.zone};draft=null;S.sort='';S.ssi=null;render()};
}
function nav(){
 const nH=R.filter(r=>r.k).length;
 const items=[['hot','Hot 100',nH],['all','Бүх шинэ',R.length],['sv','♥ Хадгалсан',Object.keys(SV).length]];
 $('#nav').innerHTML=items.map(([v,l,n])=>`<button type="button" data-v="${v}" class="${S.v===v?'on':''}">${l}<i>${n.toLocaleString('en')}</i></button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{S.v=b.dataset.v;S.n=20;render(true)});
}
function head(){
 const all=R.filter(r=>match(r,{...S.f,rm:''},S.cat,S.q,S.v));
 const n=S.v==='sv'?Object.keys(SV).length:results().length;
 const title=S.v==='sv'?'Хадгалсан листүүд':(S.cat?CN[S.cat]:(S.v==='hot'?'Hot 100 листинг':'Бүх шинэ листинг'));
 $('#crumb').textContent=['Бусад оффисуудын листинг',S.v==='hot'?'Hot 100':S.v==='all'?'Бүх шинэ':'Хадгалсан',S.cat?CN[S.cat]:'',S.f.city,S.f.zone,S.q].filter(Boolean).join(' › ');
 $('#h1').innerHTML=`${esc(title)}<small>${n.toLocaleString('en')}</small>`;
 const showRooms=S.v!=='sv'&&(!S.cat||S.cat==='sa'||S.cat==='ra');
 $('#rooms').innerHTML=showRooms?['1','2','3','4','5'].map(k=>{const c=all.filter(r=>r.cat==='apt'&&(k==='5'?(+r.rm||0)>=5:+r.rm===+k)).length;return `<button type="button" data-rm="${k}" class="${S.f.rm===k?'on':''}">${k==='5'?'5+':k} өрөө<i>${c.toLocaleString('en')}</i></button>`}).join(''):'';
 document.querySelectorAll('#rooms button').forEach(b=>b.onclick=()=>{S.f.rm=S.f.rm===b.dataset.rm?'':b.dataset.rm;draft=null;S.n=20;render()});
 const pool=R.filter(r=>match(r,S.f,'',S.q,S.v));
 $('#cats').innerHTML=S.v==='sv'?'':CATS.map(([k,l])=>`<button type="button" class="cat${S.cat===k?' on':''}" data-k="${k}">${l}<i>${pool.filter(r=>!k||grp(r)===k).length.toLocaleString('en')}</i></button>`).join('');
 document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{S.cat=b.dataset.k;S.n=20;render()});
 topSel();
 const nF=['pmin','pmax','amin','amax','fmin','fmax','ymin','ymax','rm'].filter(k=>S.f[k]).length;
 $('#mfn').outerHTML=nF?`<span class="n" id="mfn">${nF}</span>`:'<span id="mfn"></span>';
}
function saves(){
 const cur=JSON.stringify([S.cat,S.f]);const isSaved=SS.some(x=>JSON.stringify([x.cat,x.f])===cur);
 const any=S.cat||Object.values(S.f).some(Boolean);
 $('#savebar').className='savebar'+(isSaved?' on':'');$('#savebar').style.display=S.v==='sv'?'none':'';
 $('#savebar').innerHTML=isSaved?'♥ Хайлт хадгалагдсан':'♡ Хайлтыг дуртайд хадгалах';
 $('#savebar').onclick=()=>{if(!any){alertMsg('Эхлээд шүүлтүүр эсвэл ангилал сонгоно уу.');return}if(isSaved){SS=SS.filter(x=>JSON.stringify([x.cat,x.f])!==cur)}else{const nm=prompt2();SS.push({name:nm,cat:S.cat,f:{...S.f},seen:D.genTs})}lsw('rmx-searches',SS);render()};
 $('#svs').innerHTML=SS.length&&S.v!=='sv'?SS.map((x,i)=>{const m=R.filter(r=>match(r,x.f,x.cat,'','all'));const nn=m.filter(r=>r.ts>(x.seen||0)).length;return `<button type="button" data-i="${i}" class="${S.ssi===i?'on':''}">${esc(x.name)} · ${m.length}${nn?`<em>${nn} шинэ</em>`:''}</button>`}).join('')+'':'';
 document.querySelectorAll('#svs button[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,x=SS[i];S.cat=x.cat;S.f={...F0,...x.f};S.v='all';S.ssi=i;x.seen=D.genTs;lsw('rmx-searches',SS);draft=null;S.n=20;render(true)});
}
function prompt2(){const f=S.f,parts=[S.cat?CN[S.cat]:'',f.rm?(f.rm==='5'?'5+':f.rm)+' өрөө':'',f.city,f.zone,f.pmax?f.pmax+' сая хүртэл':''].filter(Boolean);return parts.join(', ')||'Миний хайлт'}
function alertMsg(t){const b=$('#savebar');const o=b.innerHTML;b.innerHTML=t;setTimeout(()=>{b.innerHTML=o},1800)}
function list(){
 let a=S.v==='sv'?Object.values(SV).map(v=>R.find(x=>x.mls===v.mls)||v).sort((x,y)=>(SV[y.mls]?.savedAt||0)-(SV[x.mls]?.savedAt||0)):sorted(results());
 $('#list').innerHTML=`<div class="grid">${a.length?a.slice(0,S.n).map(card).join(''):`<div class="empty">${S.v==='sv'?'Хадгалсан листинг алга. Карт дээрх ♡ дээр дарж хадгална.':'Тохирох зар алга. Шүүлтүүрээ сулруулаад үзээрэй.'}</div>`}</div>
 ${a.length>S.n?`<button type="button" class="more" id="more">Дахиад үзэх (${(a.length-S.n).toLocaleString('en')})</button>`:''}
 <p class="note">Hot 100: бусад RE/MAX оффисуудын сүүлийн 15 хоногийн листүүдээс үнэ (ижил хорооны төстэй листингүүдээс хямд), байршил, хурдан зарагдах төрлөөр оноо өгч шалгаруулсан. Хадгалсан листинг, хайлт энэ утас/browser дээр хадгалагдана. Шинэчилсэн: ${D.gen}.</p>`;
 const m=$('#more');if(m)m.onclick=()=>{S.n+=20;list()};
 document.querySelectorAll('.fav').forEach(e=>e.onclick=()=>{const k=e.dataset.m;if(SV[k])delete SV[k];else{const r=R.find(x=>x.mls===k);if(r)SV[k]=Object.assign({},r,{img:r.img&&r.img.startsWith('data:')?'':r.img,savedAt:Date.now()})}lsw('rmx-saved',SV);nav();list()});
}
function render(top){nav();head();saves();if(innerWidth>=900)side();list();if(top)try{scrollTo({top:0})}catch(_){}}
/* sheets */
function openSheet(t,body,foot,bind){$('#sht').textContent=t;$('#shb').innerHTML=body;$('#shf').innerHTML=foot;$('#sh').classList.add('open');document.body.style.overflow='hidden';bind()}
function closeSheet(){$('#sh').classList.remove('open');document.body.style.overflow=''}
$('#shx').onclick=closeSheet;$('#shbg').onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function mobileFilters(f0){
 let f={...(f0||S.f)};
 const draw=()=>openSheet('Шүүлтүүр',filterFields(f,'m-'),`<button type="button" class="reset" id="mreset" style="flex:none">Цэвэрлэх</button><button type="button" class="show" id="mshow">${results(f).length.toLocaleString('en')} зар харуулах</button>`,()=>{
  bindFields($('#shb'),'m-',()=>f,nf=>{f=nf;draw()},nf=>{f=nf;$('#mshow').textContent=results(nf).length.toLocaleString('en')+' зар харуулах'});
  $('#mshow').onclick=()=>{S.f={...readF('m-',f)};S.n=20;S.ssi=null;closeSheet();render(true)};
  $('#mreset').onclick=()=>{f={...F0,city:f.city,zone:f.zone};S.sort='';draw()}});
 draw()}
function sortSheet(){
 const opts=[['','Үндсэн (Hot эхэндээ)'],['new','Огноогоор'],['pa','Үнэ өсөхөөр'],['pd','Үнэ буурахаар'],['aa','Талбай томоос']];
 openSheet('Эрэмбэлэх',`<div class="chk" style="flex-direction:column">${opts.map(([v,l])=>`<button type="button" data-s="${v}" class="${S.sort===v?'on':''}" style="min-height:48px;text-align:left">${l}</button>`).join('')}</div>`,'',()=>{document.querySelectorAll('#shb [data-s]').forEach(b=>b.onclick=()=>{S.sort=b.dataset.s;closeSheet();render()})})}
$('#mf').onclick=()=>mobileFilters();$('#ms').onclick=sortSheet;
/* top search: district -> khoroo -> complex */
function topSel(){
 const base=R.filter(r=>match(r,{...S.f,city:'',zone:''},S.cat,'',S.v==='sv'?'all':S.v));
 const cc={};base.forEach(r=>{if(r.city)cc[r.city]=(cc[r.city]||0)+1});
 $('#tc').innerHTML=`<option value="">Бүх дүүрэг</option>`+cities.map(c=>`<option value="${esc(c)}"${S.f.city===c?' selected':''}>${esc(c)} (${cc[c]||0})</option>`).join('');
 const zc={};base.forEach(r=>{if(r.city===S.f.city&&r.zone)zc[r.zone]=(zc[r.zone]||0)+1});
 const tz=$('#tz');tz.disabled=!S.f.city;
 tz.innerHTML=`<option value="">${S.f.city?'Бүх хороо':'Эхлээд дүүрэг'}</option>`+zonesOf(S.f.city).map(z=>`<option value="${esc(z)}"${S.f.zone===z?' selected':''}>${esc(z)} (${zc[z]||0})</option>`).join('');
 if(document.activeElement!==$('#q'))$('#q').value=S.q;
}
const STOP=/ойр|сайн|холбоо|сургууль|цэцэрлэг|^орон сууц$|байгаа|худалдана|гудамж|зарна|хороо$|^\d+$/i;
function complexes(){
 const c={},d={};
 R.filter(r=>(!S.f.city||r.city===S.f.city)&&(!S.f.zone||r.zone===S.f.zone)).forEach(r=>(r.st||'').split(', ').forEach(p=>{p=p.trim().replace(/\s+/g,' ');const k=p.toLowerCase();if(p.length<3||STOP.test(p))return;c[k]=(c[k]||0)+1;d[k]=d[k]||p}));
 return Object.keys(c).map(k=>({k,name:d[k],n:c[k]}));
}
let SUG=[],act=-1;
function showSug(){
 const t=$('#q').value.trim().toLowerCase(),box=$('#sug');
 if(!t){box.classList.remove('open');SUG=[];return}
 SUG=complexes().filter(x=>x.k.includes(t)).sort((a,b)=>(b.k.startsWith(t)-a.k.startsWith(t))||b.n-a.n).slice(0,12);act=-1;
 const where=S.f.zone?S.f.zone:S.f.city?S.f.city:'Улаанбаатар';
 const hl=s=>{const i=s.toLowerCase().indexOf(t);return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length))};
 box.innerHTML=SUG.length?SUG.map((x,i)=>`<button type="button" role="option" data-i="${i}"><span>${hl(x.name)}</span><i>${x.n} зар</i></button>`).join(''):`<div class="no">${esc(where)}: ийм нэртэй хотхон олдсонгүй</div>`;
 box.classList.add('open');
 box.querySelectorAll('button').forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>pickSug(+b.dataset.i)});
}
function hideSug(){$('#sug').classList.remove('open');act=-1}
function pickSug(i){const x=SUG[i];if(!x)return;$('#q').value=x.name;hideSug();runQ()}
function runQ(){S.q=$('#q').value.trim();if(S.v==='sv')S.v='all';S.n=20;S.ssi=null;draft=null;render()}
function goLoc(){S.q='';$('#q').value='';hideSug();if(S.v==='sv')S.v='all';S.n=20;S.ssi=null;draft=null;render()}
$('#tc').onchange=e=>{S.f.city=e.target.value;S.f.zone='';goLoc()};
$('#tz').onchange=e=>{S.f.zone=e.target.value;goLoc()};
$('#q').addEventListener('input',()=>{showSug();if(!$('#q').value.trim()&&S.q){S.q='';S.n=20;render()}});
$('#q').addEventListener('blur',hideSug);
$('#q').addEventListener('keydown',e=>{
 const bs=[...$('#sug').querySelectorAll('button')];
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!bs.length)return;e.preventDefault();act=(act+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle('act',i===act));bs[act].scrollIntoView({block:'nearest'})}
 else if(e.key==='Enter'&&act>=0){e.preventDefault();pickSug(act)}
 else if(e.key==='Escape')hideSug();
});
$('#sform').onsubmit=e=>{e.preventDefault();hideSug();runQ();$('#q').blur()};
let lastW=innerWidth;addEventListener('resize',()=>{if((lastW<900)!==(innerWidth<900)){lastW=innerWidth;render()}});
render();
let seen=false;try{seen=sessionStorage.getItem('rmx-intro')==='1';sessionStorage.setItem('rmx-intro','1')}catch(e){}
const done=()=>$('#intro').classList.add('out');
if(seen||matchMedia('(prefers-reduced-motion: reduce)').matches)done();else{setTimeout(done,900);$('#intro').onclick=done}
}
</script>
</body>
</html>
